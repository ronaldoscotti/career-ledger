<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1720px; height: 1140px;
    display: grid; place-items: center;
    background:
      radial-gradient(1200px 700px at 22% 8%, #2b3550 0%, transparent 60%),
      radial-gradient(1000px 640px at 86% 92%, #3a2f2a 0%, transparent 58%),
      linear-gradient(150deg, #14161c 0%, #0d0f13 55%, #101319 100%);
    font: 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  .window {
    width: 1560px;
    border-radius: 12px;
    overflow: hidden;
    background: #1b1b1f;
    box-shadow:
      0 1px 0 rgba(255,255,255,.07) inset,
      0 2px 6px rgba(0,0,0,.30),
      0 22px 50px rgba(0,0,0,.50),
      0 60px 120px rgba(0,0,0,.45);
  }
  .bar {
    height: 38px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 14px;
    background: linear-gradient(#32323a, #26262c);
    border-bottom: 1px solid #17171b;
  }
  .lights { display: flex; gap: 8px; }
  .lights i {
    width: 12px; height: 12px; border-radius: 50%; display: block;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.35) inset;
  }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .addr {
    justify-self: center;
    min-width: 420px; max-width: 520px;
    text-align: center;
    padding: 4px 14px;
    border-radius: 6px;
    background: #1f1f24;
    color: #8f8f99;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .2px;
  }
  .addr b { color: #cfcfd6; font-weight: 500; }
  img { display: block; width: 100%; }
</style></head>
<body>
  <div class="window">
    <div class="bar">
      <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="addr">localhost:8777/<b>funnel.html</b></div>
      <div></div>
    </div>
    <img src="shot.png">
  </div>
</body></html>
